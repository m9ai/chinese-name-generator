<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .circle-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      top: -100px;
      left: -100px;
    }
    .circle-2 {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -150px;
      right: -150px;
    }
    .title {
      font-size: 72px;
      font-weight: 800;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 36px;
      opacity: 0.9;
      margin-bottom: 50px;
    }
    .features {
      display: flex;
      gap: 40px;
      margin-bottom: 60px;
    }
    .feature {
      font-size: 24px;
      opacity: 0.8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .url {
      font-size: 22px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="title">Chinese Name Generator</div>
  <div class="subtitle">Get Your Perfect Chinese Name</div>
  <div class="features">
    <div class="feature">Personalized Names</div>
    <div class="feature">Zodiac Analysis</div>
    <div class="feature">Five Elements</div>
  </div>
  <div class="url">chinese-name.m9ai.work</div>
</body>
</html>
